<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    #container { position: relative; width: 100%; }
    #hist { width: 100%; }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: ew-resize;
    }
  </style>
  <script>
    const COMPONENT_HEIGHT = 220;
    let pendingArgs              = null;
    let plotlyReady              = false;
    let currentCutoff            = 0;
    let dragging                 = false;
    let plotRendered             = false;
    let renderReceived           = false;
    let ignoreNextRenderCutoff   = false;

    function _send(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data), "*"
      );
    }

    function sendReady() {
      _send("streamlit:componentReady", { apiVersion: 1 });
      _send("streamlit:setFrameHeight", { height: COMPONENT_HEIGHT });
    }
    sendReady();
    const retryTimer = setInterval(() => {
      if (renderReceived) { clearInterval(retryTimer); return; }
      sendReady();
    }, 100);

    window.addEventListener("message", (event) => {
      if (event.data.type !== "streamlit:render") return;
      renderReceived = true;
      const { values, cutoff, xaxis_title } = event.data.args;
      // If we just sent a new value, the next render will carry the stale
      // pre-drag cutoff from Streamlit. Keep our local currentCutoff instead.
      let effectiveCutoff = cutoff;
      if (ignoreNextRenderCutoff) {
        ignoreNextRenderCutoff = false;
        effectiveCutoff = currentCutoff;
      }
      pendingArgs = { values, cutoff: effectiveCutoff, xaxis_title };
      if (plotlyReady) doRender(pendingArgs);
    });
  </script>
</head>
<body>
  <div id="container">
    <div id="hist"></div>
    <div id="overlay"></div>
  </div>

  <script>
    function onPlotlyReady() {
      plotlyReady = true;
      if (pendingArgs) doRender(pendingArgs);
    }

    function doRender(args) {
      renderPlot(args.values, args.cutoff, args.xaxis_title || "value");
    }

    function renderPlot(vals, cutoff, xaxisTitle) {
      currentCutoff = cutoff;
      const data = [{
        type: "histogram",
        x: vals,
        nbinsx: 150,
        marker: { color: "#888888" },
        hovertemplate: xaxisTitle + ": %{x:.3f}<br>count: %{y}<extra></extra>"
      }];
      const layout = {
        height: COMPONENT_HEIGHT,
        margin: { l: 50, r: 20, t: 10, b: 40 },
        xaxis: { title: xaxisTitle, fixedrange: true, color: "#ccc", gridcolor: "#333" },
        yaxis: { title: "count",    fixedrange: true, color: "#ccc", gridcolor: "#333" },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor:  "rgba(0,0,0,0)",
        dragmode: false,
        shapes: [{
          type: "line", x0: cutoff, x1: cutoff, y0: 0, y1: 1, yref: "paper",
          line: { color: "#ff4444", width: 2 }
        }],
        annotations: [{
          x: cutoff, y: 1, yref: "paper",
          xanchor: "left", yanchor: "top",
          text: `ω = ${cutoff.toFixed(3)}`,
          showarrow: false,
          font: { color: "#ff4444", size: 11 }
        }]
      };
      Plotly.react("hist", data, layout, { displayModeBar: false, scrollZoom: false })
            .then(() => { plotRendered = true; });
    }

    function pixelToDataX(clientX) {
      const el    = document.getElementById("hist");
      const rect  = el.getBoundingClientRect();
      const xaxis = el._fullLayout.xaxis;
      return xaxis.range[0] + (clientX - rect.left - xaxis._offset) / xaxis._length
             * (xaxis.range[1] - xaxis.range[0]);
    }

    function updateLine(clientX) {
      if (!plotRendered) return;
      const el    = document.getElementById("hist");
      const xaxis = el._fullLayout.xaxis;
      let x = Math.max(xaxis.range[0], Math.min(xaxis.range[1], pixelToDataX(clientX)));
      currentCutoff = x;
      Plotly.relayout("hist", {
        "shapes[0].x0":        x, "shapes[0].x1":        x,
        "annotations[0].x":    x,
        "annotations[0].text": `ω = ${x.toFixed(3)}`
      });
    }

    const overlay = document.getElementById("overlay");
    overlay.addEventListener("mousedown",  (e) => { dragging = true;  updateLine(e.clientX); });
    window .addEventListener("mousemove",  (e) => { if (dragging) updateLine(e.clientX); });
    window .addEventListener("mouseup",    ()  => {
      if (!dragging) return;
      dragging = false;
      ignoreNextRenderCutoff = true;
      _send("streamlit:setComponentValue", { value: { cutoff: currentCutoff, t: Date.now() } });
    });
  </script>

  <!-- Plotly last so onPlotlyReady is defined before onload fires -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" onload="onPlotlyReady()"></script>
</body>
</html>
